data:
  class: HKbiCD.HKDataset
  dataset_name: "HKCD"
  task: change_detection
  dataTrainFile: /home/user/zhanwenxiao/instancesegmentation/data/hkcd/train/
  dataValFile: /home/user/zhanwenxiao/instancesegmentation/data/hkcd/validation/
  dataTestFile: /home/user/zhanwenxiao/instancesegmentation/data/hkcd/test/
  dataroot: data
  preprocessed_dir: /home/user/zhanwenxiao/instancesegmentation/data/hkcd/testets/
  nameInPly: "vertex"
  first_subsampling: 1.35 # Grid size of the input data
  use_category: False # Use object category information
  radius: 30
  sample_per_epoch: 1500
  fix_cyl: False # Fix cylinder a special seed and do not apply DA --> for transfer learning tests
  DA: True # Make data augmentation for train ds
  pre_transforms: # Offline transforms, done only once
    - transform: GridSampling3D
      params:
        size: ${data.first_subsampling}
        mode: last


  load_preprocessed: False # Whether to load or not pre_transform point clouds, if not original files will be computed again
  load_trees: False # Whether to load or not kd trees if possible

